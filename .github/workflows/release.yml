name: release

# 只在 release/** 分支上触发。**不**挂 main 的每次推送：那样每个提交都会尝试
# 建一个同名 tag，第二次开始全红，然后人会学会忽略这条流水线。
# 触发策略本身有断言在守（快闸门里那条「release 只在 release/** 上触发」，
# 双向：漏了要红，多挂了 main 或 ** 也要红）。
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

# 发布不许被后一次推送提掉：插一半会留下一个只有部分资产的 Release，
# 而那玩意在面板上是绿的。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    name: 安装包闸门
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: dist-linux
          - os: macos-14
            slug: dist-mac
          - os: windows-2022
            slug: dist-win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装依赖
        run: npm install --no-audit --no-fund
      # tee 必须配 pipefail，否则退出码是 tee 的 0：闸门红了 job 照样绿。
      - name: 跑安装包闸门
        id: gate
        continue-on-error: true
        shell: bash
        env:
          TODOX_DIST_SLUG: ${{matrix.slug}}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify-dist.mjs 2>&1 | tee test/artifacts/stdout-${{matrix.slug}}.log
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{matrix.slug}}
          path: test/artifacts/
          if-no-files-found: error
      # installers/ 的内容由闸门决定，不是 dist/* 通配符。见 verify-dist.mjs 头部。
      - name: 上传安装包
        if: steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{matrix.slug}}
          path: installers/
          if-no-files-found: error
      - name: 闸门失败则失败
        if: steps.gate.outcome == 'failure'
        run: exit 1

  publish:
    name: 发布 Release
    needs: [dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 取版本号
        id: v
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 下载三平台安装包
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true
      # 在建 Release **之前**先数一遍。资产不齐就别发出去 —— 一个缺了 mac 的
      # Release 从外面看和完整的一模一样。8 = linux 2 + mac 4 + win 2，
      # 和 verify-dist.mjs 的 PLAN 是一组，改一个必须重算另一个。
      - name: 发布前清点资产
        shell: bash
        run: |
          set -euo pipefail
          ls -la installers
          n=$(find installers -type f | wc -l | tr -d ' ')
          echo "将要发布 $n 个文件"
          test "$n" -eq 8
      # 发布说明里**不写闸门条数**。那是硬编码散文，注定漂 —— v1.0.1 的说明里
      # 写着 45 条而实际 51 条，而且漂了不会有任何动静。指向那次提交的报告评论，
      # 它是自动生成的，永远和实际一致。
      - name: 建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: TodoX ${{ steps.v.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: installers/*
          body: |
            TodoX ${{ steps.v.outputs.tag }} — Electron 三平台待办事项应用。

            | 平台 | 下载 |
            | --- | --- |
            | Windows | `TodoX Setup *.exe`（安装版）或 `*-win.zip`（免安装） |
            | macOS | `*-arm64.dmg`（Apple 芯片）或 `*-x64.dmg`（Intel） |
            | Linux | `*.AppImage`（免安装，`chmod +x` 后直接跑）或 `*.deb` |

            **安装包没有签名。** macOS 会拦，右键「打开」再确认一次；
            Windows SmartScreen 会拦，点「更多信息」→「仍要运行」。

            这一版的逐项验证结果（快闸门 / 端到端 / 三平台安装包 / 发布资产校验）
            回写在[构建那次提交的评论](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})里。

  # 发布那步退出码为 0 证明不了用户下载得到东西。这个 job 把 Release 从 API
  # 读回来数资产 —— 正向痕迹。它挂 if: always()，所以上游灸了它也会跑，
  # 然后如实报「读不到 Release」，而不是静默跳过。
  verify:
    name: 发布资产校验闸门
    needs: [dist, publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 跑发布资产校验闸门
        id: gate
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify-release.mjs 2>&1 | tee test/artifacts/stdout-release-assets.log
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-release-assets
          path: test/artifacts/
          if-no-files-found: error
      - name: 闸门失败则失败
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # 私有仓转 private 之后，公开下载得走 todox-desktop 的 Release，所以八个
  # 安装包要同步过去。
  #
  # 顺序是承重的：**建草稿 -> 上传 -> 审计 -> 通过了才转正。** 第一版直接建成
  # 非草稿，那次上传失败后在公开仓留下一个「对外可见但 0 个资产」的 Release，
  # 从外面看和正常的一模一样。草稿是个看得见的失败态。
  #
  # **而顺序承重带来一个后果：镜像闸门断言的是「此刻还是草稿」，所以它这辈子**
  # **都不可能断言「已经对外可见」那个终态。** 那一段原来只有一句读回来打印,
  # 打印了没人解析，于是这条链最后一步完全没人守。现在转正那一步自己读回来
  # 并断言，退出码是真的。
  #
  # 这个 job **没有 job 级 if**：条件写歪会让它静默永不执行，而 run 依然全绿。
  # publish 挂了它会因依赖失败被跳过，那时 composer 报「没有产出报告」——
  # 响亮，而且原因就在同一条评论里（publish 的 result 也在 gates 数组里）。
  mirror:
    name: 同步 Release 到公开仓
    needs: [dist, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 令牌缺失不许静默跳过。静默跳过和「同步成功」在面板上长得一模一样，
      # 而这条链路的意义就是「公开的那份下载得到东西」。
      - name: 确认镜像令牌存在
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo '未配置 MIRROR_TOKEN，本次没有同步任何安装包（不是「同步成功」）。'
            echo '需要一个对 supercubegame/todox-desktop 有 contents:write 权限的 PAT。'
            exit 1
          fi
          echo '令牌就位'

      - name: 下载三平台安装包
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # 文件名一定要用 -print0 | xargs -0 传。`$(find ...)` 不加引号会把
      # `TodoX Setup 1.0.2.exe` 词分割成三个参数，upload 整体失败,而症状是
      # 「公开仓一个资产都没有」，完全看不出是空格的事。审计里有一条专门守它。
      - name: 同步到公开仓 Release（先建草稿）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
          MIRROR: supercubegame/todox-desktop
        run: |
          set -euo pipefail
          test -n "$TAG"
          n=$(find installers -type f | wc -l | tr -d ' ')
          echo "准备同步 $n 个文件到 $MIRROR $TAG"
          test "$n" -eq 8
          find installers -type f -printf '  %f  %s 字节\n'
          notes=$(printf 'TodoX %s — 跳平台桌面待办事项应用。\n\n| 平台 | 下载 |\n| --- | --- |\n| Windows | `TodoX Setup *.exe`（安装版）或 `*-win.zip`（免安装） |\n| macOS | `*-arm64.dmg`（Apple 芯片）或 `*-x64.dmg`（Intel） |\n| Linux | `*.AppImage`（`chmod +x` 后直接跑）或 `*.deb` |\n\n**安装包没有签名。** macOS 会提示无法验证开发者，到「系统设置 → 隐私与安全性」点「仍要打开」；Windows SmartScreen 会拦一次，点「更多信息」→「仍要运行」。\n' "$TAG")
          if gh release view "$TAG" --repo "$MIRROR" >/dev/null 2>&1; then
            echo "$TAG 已存在，退回草稿并清空旧资产后重传"
            gh release edit "$TAG" --repo "$MIRROR" --draft=true --prerelease=false --notes "$notes"
            for name in $(gh release view "$TAG" --repo "$MIRROR" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$name" --repo "$MIRROR" --yes
            done
          else
            gh release create "$TAG" --repo "$MIRROR" --draft --title "TodoX $TAG" --notes "$notes"
          fi
          find installers -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$MIRROR" --clobber
          gh release view "$TAG" --repo "$MIRROR" --json tagName,isDraft,assets

      # 上传接口收下了不等于公开仓那边挂上去了，更不等于挂的是**这次**打的包。
      # 这个闸门逐个比对 sha256 —— 详见 verify-release-mirror.mjs 头部。
      - name: 跑公开仓 Release 校验闸门
        id: gate
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          TODOX_RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify-release-mirror.mjs 2>&1 | tee test/artifacts/stdout-release-mirror.log

      # 审计通过了才对外可见。审计红的时候公开仓上留下的是一个草稿,
      # 别人下载不到半成品，而我看得见它红在哪。
      #
      # **转正之后必须读回来断言，不是打印。** 这一步原来的最后一行是
      # `gh release view ... --json tagName,isDraft,isLatest,url` —— 打印了，
      # 没人解析。而镜像闸门断言的是「此刻还是草稿」，它结构上不可能断言这个
      # 终态,于是「公开仓那个 Release 现在对外可见吗」一条断言都没有。
      # 日志里有答案而没有断言，等于没有。
      #
      # 读回来放个循环是因为刚转正时列表接口偶尔还没一致。**循环不许削弱断言**：
      # 五次都不满足就 exit 1，而不是 `|| true` 然后往下走。
      - name: 审计通过才转正，并读回来断言终态
        if: steps.gate.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
          MIRROR: supercubegame/todox-desktop
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$MIRROR" --draft=false --latest
          ok=0
          for i in 1 2 3 4 5; do
            live=$(gh release view "$TAG" --repo "$MIRROR" --json tagName,isDraft,isLatest,url,assets 2>/dev/null || echo '{}')
            draft=$(jq -r '.isDraft // empty' <<<"$live" 2>/dev/null || echo '')
            latest=$(jq -r '.isLatest // empty' <<<"$live" 2>/dev/null || echo '')
            tag=$(jq -r '.tagName // empty' <<<"$live" 2>/dev/null || echo '')
            n=$(jq -r '.assets | length' <<<"$live" 2>/dev/null || echo 0)
            echo "第 $i 次读回：isDraft=$draft isLatest=$latest tag=$tag assets=$n"
            if [ "$draft" = 'false' ] && [ "$latest" = 'true' ] && [ "$tag" = "$TAG" ] && [ "$n" -eq 8 ]; then
              ok=1
              jq -r '.url' <<<"$live"
              break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo '转正之后读回来的终态不对 —— 公开仓那个 Release 现在不是「对外可见 + latest + 8 个资产」。'
            echo '注意：这一步失败时公开仓上留下的可能是一个已经转正但资产不全的发布，去手工看一眼。'
            exit 1
          fi
          echo '终态已断言：对外可见、标记为 latest、8 个资产。'

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-release-mirror
          path: test/artifacts/
          if-no-files-found: error
      - name: 闸门失败则失败
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # 回写走的是和 verify.yml 同一份共享 workflow，只是换了 composer 入口和 marker。
  # **跟随上游 `@main`。2026-08-16 从钉 SHA 改过来的。**
  #
  # 这里原来写着「不许 @main」，而那个担心（上游改一行就悄悄改掉这四条流水线
  # 的行为，而回写坏掉的表现是「闸门全绿但没人看得到结论」）**本身没错**。
  # 错的是它漏了一个消费者：flappycat 从建立起就用着 @main，而本仓那条
  # 「四份只能钉同一个 SHA」的断言只扫本仓，看不见它。
  #
  # 快闸门现在断言四份 workflow **跟的引用集合大小恰好为 1**（只改一半也要红 ——
  # 那一条一字未改，变的只是它数的东西不再叫 SHA），而且必须恰好是 `main`、
  # 不许是 40 位 SHA。跟随主干的代价落在仓外（一条 30 天期限 + Quinn 每天读上游），
  # 详见 verify.yml 里那段。
  summary:
    name: 回报结果
    if: always()
    needs: [dist, publish, verify, mirror]
    permissions:
      contents: write
      pull-requests: write
    uses: supercubegame/ci-workflows/.github/workflows/report.yml@main
    with:
      node-version: '20'
      gates: '[{"name":"安装包闸门","result":"${{ needs.dist.result }}"},{"name":"发布 Release","result":"${{ needs.publish.result }}"},{"name":"发布资产校验闸门","result":"${{ needs.verify.result }}"},{"name":"公开仓 Release 同步","result":"${{ needs.mirror.result }}"}]'
      composer-files: scripts/compose-release-report.mjs scripts/lib/report.mjs scripts/lib/compose.mjs
      composer-entry: scripts/compose-release-report.mjs
      marker: '<!-- todox-release -->'
