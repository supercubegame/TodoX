name: screenshots

# 只在文档类分支上跑。这是个有意的条件触发，所以快闸门里有一条断言逐字核对
# 下面的 branches 行 —— 写歪之后这个 job 会静默永不执行，而所有 run 依然全绿，
# 我会以为「截图流水线跑过了，只是没产出」。
on:
  push:
    branches: ['docs/**', 'shots/**']
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: 生成截图
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 缓存 Electron 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: 装依赖
        run: npm install --no-audit --no-fund
      # xvfb 默认 8 位色深，那会让「背景色等于主题令牌」和「探针像素个数」
      # 两条断言一起变成掷骰子。显式要 24 位。
      #
      # continue-on-error 是为了让日志还能上传；job 在最后一步才真的失败。
      # tee 一定要配 pipefail，否则管道退出码取 tee 的 0 —— 闸门红了 job 照样绿。
      - name: 生成截图
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          xvfb-run -a --server-args="-screen 0 1600x1200x24" node scripts/shoot.mjs 2>&1 | tee test/artifacts/stdout-shots.log
      - name: 上传日志与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-artifacts
          path: |
            test/artifacts/
            docs/screenshots/
          if-no-files-found: error
      # 只有截图闸门绿了才回写。红的时候提交上去，等于把黑图钉进仓库。
      #
      # 提交信息里的 [skip ci] 是承重的：这一步推回的是**同一条分支**，而这个
      # workflow 就挂在这条分支的 push 上 —— 没有它就是一个无限循环。
      # 快闸门有一条断言在守这个标记。
      - name: 回写截图
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo '截图与仓库里的完全一致，没有需要提交的改动'
            exit 0
          fi
          git commit -m 'chore(shots): 由 CI 重新生成截图 [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
          git log -1 --stat
      - name: 闸门失败则失败
        if: steps.gate.outcome == 'failure'
        run: exit 1
